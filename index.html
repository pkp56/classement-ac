<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionnaire de Championnat Assetto Corsa</title>
    <style>
        :root { --bg: #1a1a1a; --card: #2d2d2d; --text: #ffffff; --accent: #e50914; --border: #444; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; border-bottom: 3px solid var(--accent); padding-bottom: 10px; }
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .tab-btn.active { background: var(--accent); border-color: var(--accent); }
        .content-section { display: none; background: var(--card); padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .content-section.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: rgba(0,0,0,0.2); color: var(--accent); }
        .select-box { background: var(--bg); color: var(--text); padding: 8px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 15px; width: 250px; }
        .flex-grid { display: flex; gap: 20px; flex-wrap: wrap; }
        .card { flex: 1; min-width: 280px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 6px; border-left: 4px solid var(--accent); }
        .badge-good { color: #2ecc71; font-weight: bold; }
        .badge-bad { color: #e74c3c; font-weight: bold; }
        .compare-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
    </style>
</head>
<body>

<header>
    <h1>🏆 Assetto Corsa — Classement & Championnat</h1>
</header>

<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('classement')">Classement</button>
    <button class="tab-btn" onclick="switchTab('courses')">Résumés Courses</button>
    <button class="tab-btn" onclick="switchTab('pilotes')">Fiches Pilotes</button>
    <button class="tab-btn" onclick="switchTab('comparateur')">Comparateur</button>
</div>

<!-- SECTION 1 : CLASSEMENT GENERAL -->
<div id="classement" class="content-section active">
    <h2>Classement Général des Pilotes</h2>
    <table>
        <thead>
            <tr>
                <th>Pos</th>
                <th>Pilote</th>
                <th>Points</th>
                <th>Courses Disputées</th>
                <th>Victoires</th>
            </tr>
        </thead>
        <tbody id="leaderboard-data"></tbody>
    </table>
</div>

<!-- SECTION 2 : RESUMES DE COURSES -->
<div id="courses" class="content-section">
    <h2>Historique & Résumés des Courses</h2>
    <select id="race-selector" class="select-box" onchange="renderRaceSummary()"></select>
    <div id="race-details"></div>
</div>

<!-- SECTION 3 : FICHES PILOTES -->
<div id="pilotes" class="content-section">
    <h2>Profil Individuel du Pilote</h2>
    <select id="driver-selector" class="select-box" onchange="renderDriverProfile()"></select>
    <div id="driver-profile-content"></div>
</div>

<!-- SECTION 4 : COMPARATEUR DE PILOTES -->
<div id="comparateur" class="content-section">
    <h2>Comparer deux Pilotes</h2>
    <div style="display:flex; gap: 20px;">
        <select id="compare-1" class="select-box" onchange="runComparison()"></select>
        <select id="compare-2" class="select-box" onchange="runComparison()"></select>
    </div>
    <div class="compare-container" id="comparison-results"></div>
</div>

<script>
    let db = { standings: [], races: [], driversData: {} };

    // Chargement des données JSON depuis le dossier data/
    async function loadData() {
        try {
            const response = await fetch('data/championship.json');
            db = await response.json();
            initApp();
        } catch (err) {
            document.getElementById('leaderboard-data').innerHTML = `<tr><td colspan="5" style="color:red">Erreur : Le fichier data/championship.json est introuvable ou mal configuré.</td></tr>`;
        }
    }

    function initApp() {
        renderLeaderboard();
        populateSelectors();
        renderRaceSummary();
        renderDriverProfile();
        runComparison();
    }

    function switchTab(tabId) {
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // 1. Rendu du Classement Général
    function renderLeaderboard() {
        let html = '';
        db.standings.sort((a,b) => b.points - a.points).forEach((p, idx) => {
            html += `<tr>
                <td><b>${idx + 1}</b></td>
                <td>${p.name}</td>
                <td>${p.points} pts</td>
                <td>${p.races}</td>
                <td>${p.wins} 🥇</td>
            </tr>`;
        });
        document.getElementById('leaderboard-data').innerHTML = html;
    }

    // Remplissage des menus déroulants
    function populateSelectors() {
        const raceSel = document.getElementById('race-selector');
        const drvSel = document.getElementById('driver-selector');
        const comp1 = document.getElementById('compare-1');
        const comp2 = document.getElementById('compare-2');
        
        db.races.forEach(r => raceSel.innerHTML += `<option value="${r.id}">${r.name}</option>`);
        db.standings.forEach(p => {
            const opt = `<option value="${p.name}">${p.name}</option>`;
            drvSel.innerHTML += opt;
            comp1.innerHTML += opt;
            comp2.innerHTML += opt;
        });
        if(comp2.options[1]) comp2.selectedIndex = 1; // Sélectionne le 2e pilote par défaut pour comparer
    }

    // 2. Rendu des Résumés de Course
    function renderRaceSummary() {
        const id = document.getElementById('race-selector').value;
        const race = db.races.find(r => r.id == id);
        if(!race) return;

        let rows = '';
        race.results.forEach((res, i) => {
            rows += `<tr><td>${i+1}</td><td>${res.name}</td><td>${res.timeOrGap}</td><td>+${res.ptsEarned}</td></tr>`;
        });

        document.getElementById('race-details').innerHTML = `
            <h3>${race.name} — Circuit : ${race.track}</h3>
            <p><b>Résumé :</b> ${race.summary}</p>
            <table>
                <thead><tr><th>Pos</th><th>Pilote</th><th>Temps / Écart</th><th>Points</th></tr></thead>
                <tbody>${rows}</tbody>
            </table>`;
    }

    // 3. Rendu des Fiches Pilotes
    function renderDriverProfile() {
        const name = document.getElementById('driver-selector').value;
        const stats = db.standings.find(p => p.name === name);
        const bio = db.driversData[name] || { good: "Régularité", bad: "Qualifications" };
        if(!stats) return;

        document.getElementById('driver-profile-content').innerHTML = `
            <div class="flex-grid">
                <div class="card">
                    <h3>Statistiques Globales</h3>
                    <p><b>Points totaux :</b> ${stats.points} pts</p>
                    <p><b>Courses complétées :</b> ${stats.races}</p>
                    <p><b>Victoires :</b> ${stats.wins}</p>
                </div>
                <div class="card">
                    <h3>Analyse des Performances</h3>
                    <p><b>💪 Point Fort :</b> <span class="badge-good">${bio.good}</span></p>
                    <p><b>⚠️ Point Faible :</b> <span class="badge-bad">${bio.bad}</span></p>
                </div>
            </div>`;
    }

    // 4. Comparateur de pilotes
    function runComparison() {
        const p1 = document.getElementById('compare-1').value;
        const p2 = document.getElementById('compare-2').value;
        const s1 = db.standings.find(p => p.name === p1);
        const s2 = db.standings.find(p => p.name === p2);
        if(!s1 || !s2) return;

        const buildBlock = (s) => `
            <div class="card">
                <h3>${s.name}</h3>
                <p><b>Points :</b> ${s.points} pts</p>
                <p><b>Courses :</b> ${s.races}</p>
                <p><b>Victoires :</b> ${s.wins}</p>
            </div>`;
        document.getElementById('comparison-results').innerHTML = buildBlock(s1) + buildBlock(s2);
    }

    window.onload = loadData;
</script>
</body>
</html>
