<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Championnat Assetto Corsa</title>
<style>
:root{--bg:#1a1a1a;--card:#2d2d2d;--text:#fff;--muted:#a8a8a8;--accent:#e50914;--border:#444;--good:#2ecc71;--bad:#e74c3c}
*{box-sizing:border-box}
body{font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text);margin:0 auto;padding:20px;max-width:1000px}
header{text-align:center;margin-bottom:24px;border-bottom:3px solid var(--accent);padding-bottom:10px}
h1{margin:0 0 8px}
.tabs{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tab-btn{background:var(--card);color:var(--text);border:1px solid var(--border);padding:10px 18px;cursor:pointer;font-weight:bold;border-radius:4px}
.tab-btn[aria-selected="true"]{background:var(--accent);border-color:var(--accent)}
.tab-btn:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.panel{display:none;background:var(--card);padding:20px;border-radius:8px}
.panel.active{display:block}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin:12px 0 24px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:rgba(0,0,0,.2);color:var(--accent)}
select,input[type=password]{background:var(--bg);color:var(--text);padding:8px;border:1px solid var(--border);border-radius:4px;width:250px;max-width:100%}
.row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:rgba(0,0,0,.2);padding:15px;border-radius:6px;border-left:4px solid var(--accent)}
.card h3{margin-top:0}
.good{color:var(--good)}.bad{color:var(--bad)}.muted{color:var(--muted)}
ul.traits{margin:0;padding-left:18px}
.badge{background:var(--bad);padding:2px 6px;border-radius:4px;font-size:12px;font-weight:bold}
.admin{background:#222;border:1px dashed var(--accent);padding:15px;margin-bottom:20px;border-radius:6px;text-align:center}
.file-label{background:var(--accent);padding:10px 15px;border-radius:4px;cursor:pointer;font-weight:bold;display:inline-block}
.file-label:focus-within{outline:3px solid #fff;outline-offset:2px}
.file-label input{position:absolute;opacity:0;width:1px;height:1px}
.ok{color:var(--good)}.ko{color:var(--bad)}
</style>
</head>
<body>
<header><h1>Assetto Corsa : classement et championnat</h1></header>

<section class="admin" id="admin" hidden>
  <p style="margin-top:0"><b>Zone organisateur.</b> Ajoutez le fichier <code>.json</code> d’une session de <b>course</b> (les essais et qualifs sont refusés).</p>
  <div class="row" style="justify-content:center;align-items:center">
    <label class="file-label">Choisir un fichier de course<input type="file" id="file" accept=".json"></label>
    <input type="password" id="admin-key" placeholder="Clé organisateur (si requise)" autocomplete="off">
  </div>
  <p id="admin-msg" role="status" aria-live="polite" style="margin-bottom:0"></p>
</section>

<div class="tabs" role="tablist">
  <button class="tab-btn" role="tab" data-tab="classement" aria-selected="true">Classement</button>
  <button class="tab-btn" role="tab" data-tab="courses" aria-selected="false">Courses</button>
  <button class="tab-btn" role="tab" data-tab="pilotes" aria-selected="false">Pilotes</button>
  <button class="tab-btn" role="tab" data-tab="comparateur" aria-selected="false">Comparateur</button>
</div>

<section id="classement" class="panel active" role="tabpanel">
  <h2>Classement général</h2>
  <div class="table-wrap"><table>
    <thead><tr><th>Pos</th><th>Pilote</th><th>Points</th><th>Courses</th><th>Victoires</th><th>Podiums</th></tr></thead>
    <tbody id="leaderboard"></tbody>
  </table></div>
</section>

<section id="courses" class="panel" role="tabpanel">
  <h2>Résumés des courses</h2>
  <select id="race-select" aria-label="Course"></select>
  <div id="race-details"></div>
</section>

<section id="pilotes" class="panel" role="tabpanel">
  <h2>Fiche pilote</h2>
  <select id="driver-select" aria-label="Pilote"></select>
  <div id="driver-details"></div>
</section>

<section id="comparateur" class="panel" role="tabpanel">
  <h2>Comparer deux pilotes</h2>
  <div class="row">
    <select id="cmp1" aria-label="Premier pilote"></select>
    <select id="cmp2" aria-label="Second pilote"></select>
  </div>
  <div id="cmp-details"></div>
</section>

<script>
"use strict";

// ---------- Réglages ----------
const DATA_URL = "data/championship.json";
const SAVE_URL = "/api/save-championship";
const SCORING = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1]; // points par place, 0 au-delà
const FINISH_RATIO = 0.75;      // sous 75 % des tours du leader : 0 point
const MIN_IMPACT = 5;           // chocs plus faibles ignorés
const IMPACT_SPEED_FACTOR = 1;  // mettre 3.6 si le serveur fournit des m/s

// ---------- Utilitaires ----------
let db = { races: [] };
let drivers = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const f1 = n => n.toFixed(1).replace(".", ",");
const plural = (n, a, b) => (n > 1 ? b : a);
const fmtLap = ms => {
  if (!(ms > 0)) return "–";
  return Math.floor(ms / 60000) + ":" + ((ms % 60000) / 1000).toFixed(3).padStart(6, "0");
};
const fmtClock = ms => {
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
};
const median = a => {
  const s = [...a].sort((x, y) => x - y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};

// ---------- Données ----------
function normalize(raw) {
  const races = Array.isArray(raw && raw.races) ? raw.races : [];
  return {
    races: races.map((r, i) => ({
      ...r,
      id: r.id ?? i + 1,
      results: (r.results || []).map((x, j) => ({ pos: j + 1, ...x })),
      collisions: r.collisions || []
    }))
  };
}

async function loadData() {
  try {
    const res = await fetch(DATA_URL, { cache: "no-store" });
    if (res.ok) db = normalize(await res.json());
  } catch (e) { /* premier démarrage : pas encore de fichier */ }
  refresh();
}

// Le classement est recalculé à partir des courses : rien n'est cumulé à la main.
function computeDrivers() {
  const map = new Map();
  for (const race of db.races) {
    for (const r of race.results) {
      const d = map.get(r.name) || { name: r.name, points: 0, races: 0, wins: 0, podiums: 0, dnf: 0, collisions: 0, positions: [] };
      d.points += r.ptsEarned || 0;
      d.races++;
      d.positions.push(r.pos);
      if (r.pos === 1) d.wins++;
      if (r.pos <= 3) d.podiums++;
      if (r.dnf) d.dnf++;
      map.set(r.name, d);
    }
  }
  for (const race of db.races) {
    for (const c of race.collisions) {
      if (map.has(c.driver)) map.get(c.driver).collisions++;
      if (c.target !== c.driver && map.has(c.target)) map.get(c.target).collisions++;
    }
  }
  return [...map.values()]
    .map(d => ({ ...d, avgPos: d.positions.reduce((a, b) => a + b, 0) / d.positions.length, bestPos: Math.min(...d.positions) }))
    .sort((a, b) => b.points - a.points || b.wins - a.wins || a.avgPos - b.avgPos);
}

// ---------- Import d'une course ----------
function parseRace(data) {
  if (data.Type && data.Type !== "RACE") throw new Error("Ce fichier est une session « " + data.Type + " ». Seules les courses (RACE) sont acceptées.");
  if (!Array.isArray(data.Result) || !data.Result.length) throw new Error("Aucun résultat de course dans ce fichier.");
  const sessionFile = data.SessionFile || (data.TrackName + "_" + data.Date);
  if (db.races.some(r => r.sessionFile === sessionFile)) throw new Error("Cette course est déjà enregistrée.");

  const maxLaps = Math.max(...data.Result.map(x => x.NumLaps));
  const results = data.Result.map((x, i) => {
    const dnf = x.NumLaps < FINISH_RATIO * maxLaps;
    const scored = !dnf && !x.Disqualified;
    return {
      pos: i + 1, name: x.DriverName, guid: x.DriverGuid, laps: x.NumLaps,
      totalMs: x.TotalTime, bestLapMs: x.BestLap, grid: x.GridPosition,
      ptsEarned: scored ? (SCORING[i] || 0) : 0, dnf
    };
  });

  // Départ de la course estimé à partir des tours, pour dater les chocs
  const starts = (data.Laps || []).filter(l => l.Timestamp && l.LapTime > 0).map(l => l.Timestamp * 1000 - l.LapTime);
  const t0 = starts.length ? Math.min(...starts) : null;

  const collisions = [];
  for (const ev of data.Events || []) {
    const isCar = ev.Type === "COLLISION_WITH_CAR";
    if (ev.AfterSessionEnd || (!isCar && ev.Type !== "COLLISION_WITH_ENV")) continue;
    const speed = Math.round((ev.ImpactSpeed || 0) * IMPACT_SPEED_FACTOR);
    if (speed < MIN_IMPACT) continue;
    const driver = (ev.Driver && ev.Driver.Name) || "Inconnu";
    const target = isCar ? ((ev.OtherDriver && ev.OtherDriver.Name) || "Autre voiture") : "Décor / mur";
    // Un contact entre deux voitures est enregistré deux fois : on n'en garde qu'un
    const duplicate = isCar && collisions.some(c => c.type === "car" && c.driver === target && c.target === driver && Math.abs(c.ts - ev.Timestamp) <= 2);
    if (duplicate) continue;
    collisions.push({
      ts: ev.Timestamp, type: isCar ? "car" : "env", driver, target, speed,
      time: t0 ? fmtClock(Math.max(0, ev.Timestamp * 1000 - t0)) : "–"
    });
  }

  const id = Math.max(0, ...db.races.map(r => Number(r.id) || 0)) + 1;
  const track = data.TrackName || "Circuit";
  const best = results.filter(r => r.bestLapMs > 0).sort((a, b) => a.bestLapMs - b.bestLapMs)[0];
  const podium = results.slice(0, 3).map(r => r.name);
  const summary = podium[0] + " s’impose" + (podium[1] ? ", devant " + podium.slice(1).join(" et ") : "") + ". "
    + results.length + " pilotes classés, " + collisions.length + " choc" + plural(collisions.length, "", "s") + " relevé" + plural(collisions.length, "", "s") + "."
    + (best ? " Meilleur tour : " + best.name + " (" + fmtLap(best.bestLapMs) + ")." : "");

  return { id, sessionFile, name: "Manche " + id + " – " + track, track, date: data.Date || "", summary, results, collisions };
}

async function save(next, adminKey) {
  const res = await fetch(SAVE_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json", ...(adminKey ? { "x-admin-key": adminKey } : {}) },
    body: JSON.stringify(next)
  });
  const out = await res.json().catch(() => ({}));
  if (!res.ok || out.status !== "success") throw new Error(out.message || "Le serveur a refusé l’enregistrement.");
}

async function onFileChosen(e) {
  const file = e.target.files[0];
  if (!file) return;
  const msg = $("admin-msg");
  msg.className = ""; msg.textContent = "Analyse en cours…";
  try {
    const race = parseRace(JSON.parse(await file.text()));
    const next = { races: [...db.races, race] };
    await save(next, $("admin-key").value.trim());
    db = next; // on ne modifie l'écran qu'une fois la sauvegarde acceptée
    refresh();
    msg.className = "ok"; msg.textContent = "Course ajoutée : " + race.name + ".";
  } catch (err) {
    msg.className = "ko";
    msg.textContent = err instanceof SyntaxError ? "Fichier illisible : ce n’est pas un JSON valide." : err.message;
  }
  e.target.value = "";
}

// ---------- Affichage ----------
function refresh() {
  drivers = computeDrivers();
  renderLeaderboard();
  fillSelectors();
  renderRace(); renderDriver(); renderCompare();
}

function fill(sel, items, empty) {
  const prev = sel.value;
  sel.innerHTML = items.length
    ? items.map(([v, l]) => '<option value="' + esc(v) + '">' + esc(l) + "</option>").join("")
    : '<option value="">' + empty + "</option>";
  if (items.some(([v]) => String(v) === prev)) sel.value = prev;
}

function fillSelectors() {
  fill($("race-select"), [...db.races].reverse().map(r => [r.id, r.name]), "Aucune course");
  const names = drivers.map(d => d.name).sort((a, b) => a.localeCompare(b)).map(n => [n, n]);
  ["driver-select", "cmp1", "cmp2"].forEach(id => fill($(id), names, "Aucun pilote"));
  const c1 = $("cmp1"), c2 = $("cmp2");
  if (c1.value === c2.value && names.length > 1) c2.selectedIndex = (c1.selectedIndex + 1) % names.length;
}

function renderLeaderboard() {
  $("leaderboard").innerHTML = drivers.length
    ? drivers.map((d, i) => "<tr><td><b>" + (i + 1) + "</b></td><td>" + esc(d.name) + "</td><td>" + d.points + "</td><td>" + d.races + "</td><td>" + d.wins + "</td><td>" + d.podiums + "</td></tr>").join("")
    : '<tr><td colspan="6" class="muted">Aucune course enregistrée.</td></tr>';
}

function gapText(r, lead) {
  if (r.timeOrGap) return r.timeOrGap; // anciennes données
  if (!r.totalMs) return "–";
  if (r.pos === 1) return fmtLap(r.totalMs);
  if (r.laps === lead.laps) return "+" + ((r.totalMs - lead.totalMs) / 1000).toFixed(3) + " s";
  const d = lead.laps - r.laps;
  return "+" + d + " tour" + plural(d, "", "s");
}

function renderRace() {
  const race = db.races.find(r => String(r.id) === $("race-select").value);
  if (!race) { $("race-details").innerHTML = '<p class="muted">Aucune course sélectionnée.</p>'; return; }
  const lead = race.results[0];
  const rows = race.results.map(r =>
    "<tr><td>" + r.pos + "</td><td>" + esc(r.name) + (r.dnf ? ' <span class="muted">(non classé)</span>' : "") + "</td><td>" + (r.laps ?? "–") + "</td><td>" + esc(gapText(r, lead)) + "</td><td>" + fmtLap(r.bestLapMs) + "</td><td>+" + (r.ptsEarned || 0) + "</td></tr>").join("");
  const crashes = race.collisions.length
    ? race.collisions.map(c => "<tr><td>" + esc(c.time) + '</td><td><span class="badge">' + (c.type === "car" ? "Contact" : c.type === "env" ? "Choc décor" : esc(c.type)) + "</span></td><td><b>" + esc(c.driver) + "</b></td><td>" + esc(c.target) + "</td><td>" + c.speed + " km/h</td></tr>").join("")
    : '<tr><td colspan="5" class="good">Course propre : aucun choc relevé.</td></tr>';
  $("race-details").innerHTML =
    "<h3>" + esc(race.name) + "</h3><p>" + esc(race.summary || "") + "</p>" +
    '<h4>Résultats</h4><div class="table-wrap"><table><thead><tr><th>Pos</th><th>Pilote</th><th>Tours</th><th>Temps / écart</th><th>Meilleur tour</th><th>Points</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
    '<h4>Collisions</h4><div class="table-wrap"><table><thead><tr><th>Instant</th><th>Type</th><th>Pilote</th><th>Cible</th><th>Vitesse</th></tr></thead><tbody>' + crashes + "</tbody></table></div>";
}

// Points forts et faibles : comparés au reste du peloton, jamais inventés
function traits(d) {
  const medPos = median(drivers.map(x => x.avgPos));
  const medCol = median(drivers.map(x => x.collisions / x.races));
  const perRace = d.collisions / d.races;
  const good = [], bad = [];
  if (d.wins) good.push(d.wins + " victoire" + plural(d.wins, "", "s"));
  else if (d.podiums) good.push(d.podiums + " podium" + plural(d.podiums, "", "s"));
  if (d.avgPos < medPos) good.push("Position moyenne " + f1(d.avgPos) + ", meilleure que la médiane du peloton (" + f1(medPos) + ")");
  if (perRace < medCol) good.push("Course plutôt propre : " + f1(perRace) + " choc par course");
  if (d.dnf) bad.push(d.dnf + " course" + plural(d.dnf, "", "s") + " sous les " + FINISH_RATIO * 100 + " % des tours, sans point");
  if (d.avgPos > medPos) bad.push("Position moyenne " + f1(d.avgPos) + ", derrière la médiane du peloton (" + f1(medPos) + ")");
  if (perRace > medCol && perRace >= 2) bad.push("Nombreux chocs : " + f1(perRace) + " par course");
  return { good, bad };
}

function renderDriver() {
  const d = drivers.find(x => x.name === $("driver-select").value);
  if (!d) { $("driver-details").innerHTML = '<p class="muted">Aucun pilote sélectionné.</p>'; return; }
  const t = traits(d);
  const list = (a, cls, none) => a.length ? '<ul class="traits ' + cls + '">' + a.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>" : '<p class="muted">' + none + "</p>";
  $("driver-details").innerHTML =
    '<div class="grid"><div class="card"><h3>Statistiques</h3>' +
    "<p><b>Points :</b> " + d.points + "</p><p><b>Courses :</b> " + d.races + "</p><p><b>Victoires :</b> " + d.wins + " &nbsp; <b>Podiums :</b> " + d.podiums + "</p>" +
    "<p><b>Position moyenne :</b> " + f1(d.avgPos) + " (meilleure : " + d.bestPos + ")</p><p><b>Chocs :</b> " + d.collisions + "</p></div>" +
    '<div class="card"><h3>Points forts</h3>' + list(t.good, "good", "Aucun point fort net pour l’instant.") +
    "<h3>Points faibles</h3>" + list(t.bad, "bad", "Aucun point faible net pour l’instant.") +
    (d.races < 3 ? '<p class="muted">Moins de 3 courses : à prendre avec prudence.</p>' : "") + "</div></div>";
}

function renderCompare() {
  const A = drivers.find(d => d.name === $("cmp1").value), B = drivers.find(d => d.name === $("cmp2").value);
  if (!A || !B || A === B) { $("cmp-details").innerHTML = '<p class="muted">Choisissez deux pilotes différents.</p>'; return; }
  const lines = [
    ["Points", A.points, B.points, 1], ["Courses", A.races, B.races, 0], ["Victoires", A.wins, B.wins, 1], ["Podiums", A.podiums, B.podiums, 1],
    ["Position moyenne", f1(A.avgPos), f1(B.avgPos), -1, A.avgPos, B.avgPos], ["Meilleure place", A.bestPos, B.bestPos, -1],
    ["Chocs par course", f1(A.collisions / A.races), f1(B.collisions / B.races), -1, A.collisions / A.races, B.collisions / B.races]
  ];
  const cell = (v, mine, other, dir) => '<td class="' + (dir && mine < other ? (dir > 0 ? "bad" : "good") : dir && mine > other ? (dir > 0 ? "good" : "bad") : "") + '">' + v + "</td>";
  const rows = lines.map(([label, a, b, dir, na, nb]) => {
    const x = na ?? a, y = nb ?? b;
    return "<tr><th>" + label + "</th>" + cell(a, x, y, dir) + cell(b, y, x, dir) + "</tr>";
  }).join("");
  let wa = 0, wb = 0;
  for (const race of db.races) {
    const x = race.results.find(r => r.name === A.name), y = race.results.find(r => r.name === B.name);
    if (x && y) { if (x.pos < y.pos) wa++; else wb++; }
  }
  $("cmp-details").innerHTML =
    '<div class="table-wrap"><table><thead><tr><th></th><th>' + esc(A.name) + "</th><th>" + esc(B.name) + "</th></tr></thead><tbody>" + rows + "</tbody></table></div>" +
    "<p><b>Duel direct :</b> " + esc(A.name) + " devant " + wa + " fois, " + esc(B.name) + " devant " + wb + " fois" + (wa + wb ? " sur " + (wa + wb) + " course" + plural(wa + wb, "", "s") + " communes." : " (aucune course commune).") + "</p>";
}

// ---------- Démarrage ----------
document.querySelectorAll(".tab-btn").forEach(btn => btn.addEventListener("click", () => {
  document.querySelectorAll(".tab-btn").forEach(b => b.setAttribute("aria-selected", String(b === btn)));
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("active", p.id === btn.dataset.tab));
}));
$("race-select").addEventListener("change", renderRace);
$("driver-select").addEventListener("change", renderDriver);
$("cmp1").addEventListener("change", renderCompare);
$("cmp2").addEventListener("change", renderCompare);
$("file").addEventListener("change", onFileChosen);
$("admin").hidden = location.hash !== "#admin"; // zone organisateur : ajouter #admin à l'adresse
window.addEventListener("load", loadData);
</script>
</body>
</html>
