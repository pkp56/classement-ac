<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GDSP — Gentleman Drivers Project</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23102a32%22 width=%22100%22 height=%22100%22/><text y=%2276%22 x=%2210%22 font-size=%2272%22 fill=%22%23d8a347%22>G</text></svg>">
<style>
:root{--ink:#102a32;--cream:#f4ecd8;--red:#9c3021;--gold:#cd9a42;--line:#bdb09a}
*{box-sizing:border-box}
body{margin:0;background:#e9e0cb;color:var(--ink);font-family:Arial,sans-serif}
header{background:#102a32;color:#f4ecd8;border-bottom:5px solid #a33426}
.top{max-width:1400px;margin:auto;display:flex;align-items:center;padding:15px 35px;gap:38px}
.brand-logo{width:52px;height:60px;object-fit:contain;display:block}
.brand-title{font-size:10px;font-weight:bold;letter-spacing:1px;line-height:1.4;max-width:110px;color:#e7dec9}
.brand-group{display:flex;align-items:center;gap:10px}
.car-thumb{width:140px;height:38px;object-fit:contain;mix-blend-mode:multiply}
.race-number{font-family:Impact,sans-serif;font-size:19px;color:#9c3021}
.driver-car{display:block;width:100%;max-width:600px;height:auto;object-fit:contain;mix-blend-mode:multiply}
.profile-car{padding:20px;background:#f8f2e4;border:1px solid var(--line)}
.brand{font-family:Georgia,serif;font-weight:bold;font-size:26px;letter-spacing:2px;border:2px solid #e4d9c1;padding:8px 11px;cursor:pointer}
.brand span{color:#d59c43}
nav{display:flex;gap:25px;align-items:center;flex-wrap:wrap}
nav button{background:none;border:0;color:#d6d0c0;font-size:12px;font-weight:bold;letter-spacing:1.2px;cursor:pointer;padding:12px 0}
nav button.active{color:white;border-bottom:2px solid #d7a34b}
.right{margin-left:auto;color:#d2a55f;font-size:11px;letter-spacing:2px;font-weight:bold;white-space:nowrap}
.event-switcher{display:flex;align-items:center;gap:6px}
.event-switcher select{background:#1c3a43;color:#f4ecd8;border:1px solid #3b5a64;padding:6px 8px;font:inherit;font-size:11px;letter-spacing:.5px;max-width:360px}
.page{max-width:1330px;margin:auto;padding:34px 35px 70px}
.eyebrow{font-size:11px;letter-spacing:2.5px;font-weight:bold;text-transform:uppercase;color:var(--red)}
h1,h2,h3{font-family:Impact,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.7px;font-weight:normal}
h1{font-size:clamp(44px,6vw,80px);line-height:.98;margin:12px 0}
h2{font-size:32px;margin:8px 0 20px}
h3{font-size:21px;margin:8px 0}
.hero{background:#132d35;color:#f7ecd5;min-height:390px;display:grid;grid-template-columns:40% 1fr;overflow:hidden}
.hero-text{padding:52px 48px 52px 35px}
.hero h1{font-size:clamp(32px,4.4vw,58px);line-height:1;margin:10px 0}
.hero h1 em{color:#d8a347;font-style:normal}
.hero p{line-height:1.6;color:#d1cbbd;max-width:500px}
.hero-image{background:linear-gradient(90deg,#132d35 0%,#132d35cc 15%,#132d3555 30%,transparent 42%),url('/intro.png') center/cover}
.btn{display:inline-block;background:#ac3928;color:white;border:0;padding:14px 20px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:bold;cursor:pointer;text-decoration:none}
.btn.secondary{background:transparent;border:1px solid #b7a688;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);background:#f8f2e4;border:1px solid var(--line);margin-top:20px}
.stat{padding:22px 28px;border-right:1px solid var(--line)}
.stat:last-child{border:0}
.stat strong{font-family:Impact,sans-serif;font-size:31px;display:block}
.label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#6d726c;font-weight:bold}
.section-head{display:flex;justify-content:space-between;align-items:end;margin:45px 0 15px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.section-head h2{margin:4px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:#f8f2e4;border:1px solid var(--line);padding:25px}
.note{font-size:13px;line-height:1.6;color:#586260}
.tag{font-size:10px;letter-spacing:1px;background:#d6c6a4;padding:6px 9px;font-weight:bold;display:inline-block}
.tag.live{background:#9c3021;color:#f4ecd8}
.tag.open{background:#3b6341;color:#f4ecd8}
.tag.archive{background:#6d726c;color:#f4ecd8}
.tag.lvl{font-size:14px;width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:0;padding:0}
.tag.lvl-1{background:#d7a347;color:#2a1a0c}
.tag.lvl-2{background:#9c3021;color:#f4ecd8}
.tag.lvl-3{background:#3b6341;color:#f4ecd8}
.tag.lvl-4{background:#6d726c;color:#f4ecd8}
.lvl-badge{box-shadow:2px 2px 0 rgba(0,0,0,.35);user-select:none;image-rendering:-webkit-optimize-contrast;border:2px solid #fff;background:#fff}
td .lvl-badge{vertical-align:middle}
/* Séparateurs visuels entre tiers dans le tableau global */
tbody tr[data-tier-divider]{border-top:3px solid #132d35}
tbody tr[data-tier-divider] td{padding-top:16px}
.lvl-block{background:#f8f2e4;border:1px solid var(--line);padding:20px 24px;border-radius:2px}
.lvl-block h2{font-size:22px;margin:0 0 6px;display:flex;align-items:center;gap:10px}
.lvl-block .eyebrow{margin-bottom:6px}
.mini-bar{height:6px;background:#e8dcc3;border-radius:3px;overflow:hidden;position:relative}
.mini-bar i{display:block;height:100%;background:#9c3021}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px;text-align:left}
th{background:var(--ink);color:#eee5d1;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;padding:14px}
td{padding:13px 14px;border-bottom:1px solid #dbd0ba}
tbody tr:hover{background:#eee4cf}
.pos{font-family:Impact,sans-serif;font-size:19px;color:#9f3828}
.muted{color:#777e76;font-size:12px}
select,input{padding:11px;background:#fbf7ec;border:1px solid #b3a78e;color:var(--ink);font:inherit}
select{min-width:180px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.tabs button{padding:10px 14px;border:1px solid #b7a688;background:transparent;color:var(--ink);font-weight:bold;cursor:pointer}
.tabs button.active{background:var(--ink);color:white}
.cardlist{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.driver{background:#f8f2e4;border:1px solid var(--line);padding:19px;cursor:pointer}
.driver:hover{border-color:var(--red)}
.driver strong{font-family:Impact,sans-serif;font-size:22px;letter-spacing:.5px}
.event-card{background:#f8f2e4;border:1px solid var(--line);padding:22px;cursor:pointer;transition:transform .1s}
.event-card:hover{border-color:var(--red);transform:translateY(-2px)}
.event-card h3{margin:8px 0 6px;font-size:24px}
.event-card .coef{float:right;font-size:11px;color:#6d726c;letter-spacing:1px;text-transform:uppercase}
.footer{background:#102a32;color:#ddceb1;padding:28px 35px;font-size:11px;letter-spacing:1.5px;text-align:center}
.bar{height:8px;background:#d9cdb6}
.bar i{display:block;background:#a93828;height:100%}
.admin-input{padding:11px;background:#fbf7ec;border:1px solid #b3a78e;color:var(--ink);font:inherit;min-width:240px}
.btn.small{padding:8px 12px;font-size:10px}
.admin-round{background:#f8f2e4;border:1px solid var(--line);padding:18px}
.admin-round.dashed{border-style:dashed;display:flex;align-items:center;justify-content:center;min-height:120px}
.admin-grid{grid-template-columns:repeat(3,1fr)}
.driver-admin-list{display:grid;gap:10px}
.driver-admin-row{display:flex;justify-content:space-between;align-items:center;background:#f8f2e4;border:1px solid var(--line);padding:12px 16px}
code{background:#e6dcc3;padding:2px 5px}
.subcrumb{font-size:11px;letter-spacing:2px;color:#6d726c;text-transform:uppercase;margin-bottom:10px}
.subcrumb a{color:var(--red);cursor:pointer;text-decoration:none}
@media(max-width:800px){
  .top{gap:15px;padding:14px;flex-wrap:wrap}.right{display:none}nav{gap:12px}
  .page{padding:24px 16px 50px}.hero{grid-template-columns:1fr}.hero-text{padding:30px}
  .hero-image{min-height:170px;background-image:linear-gradient(180deg,#132d35,transparent),url('/intro.png')}
  .stats{grid-template-columns:repeat(2,1fr)}.grid,.cardlist{grid-template-columns:1fr}
  .stat{border-bottom:1px solid var(--line)}
}
.penalty{color:#a9482e;font-weight:700}
.gdsp-tip{position:relative;display:inline-flex;align-items:center;gap:3px;cursor:help;margin-left:5px;vertical-align:middle}
.gdsp-tip .gdsp-i{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#d7a347;color:#132d35;font-size:10px;font-weight:700;font-style:normal;font-family:Arial,sans-serif;letter-spacing:0;text-transform:none;line-height:1;flex-shrink:0}
.gdsp-tip .gdsp-bubble{visibility:hidden;opacity:0;position:absolute;z-index:999;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);min-width:230px;max-width:320px;padding:8px 10px;background:#1d2d22;color:#f7ecd5;font-size:11px;font-weight:400;font-family:Arial,sans-serif;letter-spacing:normal;text-transform:none;line-height:1.45;border:1px solid #d7a347;border-radius:4px;box-shadow:0 4px 12px rgba(0,0,0,.35);pointer-events:none;white-space:normal;text-align:left;transition:opacity .15s}
.gdsp-tip .gdsp-bubble b{color:#f2c979;font-weight:700}
.gdsp-tip .gdsp-bubble::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#d7a347}
.gdsp-tip:hover .gdsp-bubble,.gdsp-tip:focus-within .gdsp-bubble{visibility:visible;opacity:1}
.gdsp-tip.gdsp-tip-right .gdsp-bubble{left:auto;right:0;transform:none}
.gdsp-tip.gdsp-tip-right .gdsp-bubble::after{left:auto;right:5px;transform:none}
.gdsp-tip.gdsp-tip-left .gdsp-bubble{left:0;transform:none}
.gdsp-tip.gdsp-tip-left .gdsp-bubble::after{left:5px;transform:none}
.gdsp-tip.gdsp-bar{position:relative;margin-left:0}
.gdsp-tip.gdsp-bar .gdsp-i{position:absolute;top:-2px;right:-2px;z-index:2}
.gdsp-tip.gdsp-bar .gdsp-bubble{left:auto;right:0;transform:none}
.gdsp-tip.gdsp-bar .gdsp-bubble::after{left:auto;right:12px;transform:none}
@media(min-width:900px){.driver-hist-wrap .table-wrap,.global-rank-wrap .table-wrap,.rythme-wrap{overflow:visible}}
.rythme-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
.rythme-table th,.rythme-table td{padding:7px 10px;border-bottom:1px dashed #dbd0ba;text-align:right;font-variant-numeric:tabular-nums}
.rythme-table th:first-child,.rythme-table td:first-child{text-align:left}
.rythme-table th{background:#f1e8cf;color:#132d35;font-weight:700;font-family:Impact,sans-serif;letter-spacing:1px;font-size:11px;text-transform:uppercase}
.event-poster-wrap{max-width:880px;margin:18px auto 24px;padding:10px;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 24px rgba(19,45,53,.12);position:relative}
.event-poster-img{display:block;width:100%;height:auto;border:1px solid #d5c7af;cursor:zoom-in}
.event-poster-hint{position:absolute;right:18px;bottom:18px;background:rgba(19,45,53,.84);color:#f7ecd5;border:1px solid var(--gold);padding:4px 9px;font-size:10px;letter-spacing:1px;text-transform:uppercase;pointer-events:none;opacity:.85;transition:opacity .15s}
.event-poster-wrap:hover .event-poster-hint{opacity:1}
.poster-lightbox{display:none;position:fixed;inset:0;z-index:9999;background:rgba(12,24,29,.92);align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.poster-lightbox.open{display:flex}
.poster-lightbox img{max-width:96vw;max-height:92vh;width:auto;height:auto;object-fit:contain;border:2px solid var(--gold);box-shadow:0 14px 42px rgba(0,0,0,.65);cursor:default}
.poster-lightbox-close{position:fixed;top:16px;right:20px;background:var(--ink);color:#f7ecd5;border:1px solid var(--gold);padding:8px 13px;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer}
.drv-topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.drv-quick-switch{display:flex;align-items:center;gap:10px}
.drv-quick-switch select{min-width:230px;padding:9px 12px;background:#f8f2e4;border:1px solid var(--line);font-weight:700;color:var(--ink)}
.drv-hero{display:grid;grid-template-columns:46% 54%;border:1px solid var(--line);border-bottom:4px solid var(--red);box-shadow:0 6px 20px rgba(16,42,50,.08);position:relative}
.drv-hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:#d7a347;pointer-events:none}
.drv-hero-id{background:var(--ink);color:#f4ecd8;padding:28px 30px;display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.drv-hero-eyebrow{font-size:10px;letter-spacing:2.4px;font-weight:700;text-transform:uppercase;color:#d7a347}
.drv-id-main{display:flex;align-items:center;gap:18px}
.drv-roundel{width:68px;height:68px;border-radius:50%;background:#f8f2e4;color:var(--ink);border:3px solid #d7a347;box-shadow:0 4px 12px rgba(0,0,0,.35),inset 0 0 0 2px var(--ink);display:flex;align-items:center;justify-content:center;font-family:Impact,'Arial Narrow',sans-serif;font-size:31px;letter-spacing:.5px;flex-shrink:0;user-select:none}
.drv-roundel.drv-roundel-txt{font-size:22px;letter-spacing:1px}
.drv-hero-id h1{font-size:clamp(30px,3.4vw,46px);line-height:.98;margin:0;color:#f8f2e4}
.drv-team-line{margin-top:6px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:#d6cbb4;font-weight:700}
.drv-hero-stamps{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:14px;border-top:1px solid rgba(215,163,71,.28)}
.drv-lvl-stamp{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;background:rgba(248,242,228,.08);border:1px solid #d7a347;color:#f7ecd5;font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.drv-lvl-stamp b{color:#d7a347}
.drv-hero-car{background:#f8f2e4;padding:20px 26px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;border-left:1px solid var(--line)}
.drv-car-head,.drv-car-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.drv-car-num{font-family:Impact,'Arial Narrow',sans-serif;font-size:22px;letter-spacing:1px;color:var(--red)}
.drv-car-stage{display:flex;align-items:center;justify-content:center;min-height:150px;padding:6px 0}
.drv-car-stage .driver-car{max-width:500px;max-height:175px;width:100%;height:auto;object-fit:contain;mix-blend-mode:multiply}
.drv-car-placeholder{padding:22px 26px;border:1px dashed var(--line);color:#6d726c;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;background:#f3ead6}
.drv-car-foot{padding-top:10px;border-top:1px dashed #d8ccb4;font-size:12px;color:#586260}
.drv-car-foot b{color:var(--ink);font-family:Impact,'Arial Narrow',sans-serif;font-size:16px;font-weight:400;letter-spacing:.5px;margin-left:4px}
.drv-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.drv-kpi{background:#f8f2e4;border:1px solid var(--line);border-top:4px solid var(--ink);padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.drv-kpi.kpi-gold{border-top-color:#d7a347}
.drv-kpi.kpi-green{border-top-color:#3b6341}
.drv-kpi.kpi-red{border-top-color:var(--red)}
.drv-kpi strong{font-family:Impact,'Arial Narrow',sans-serif;font-size:34px;line-height:1.05;font-weight:400;color:var(--ink);display:block;margin-top:2px}
.drv-kpi strong.kpi-val-gold{color:#b57f1e}
.drv-kpi strong.kpi-val-pos{color:#3b6341}
.drv-kpi strong.kpi-val-neg{color:var(--red)}
.drv-kpi-sub{font-size:11px;color:#6d726c}
.drv-perf-grid{display:grid;grid-template-columns:43% 1fr;gap:20px;align-items:stretch}
.drv-perf-grid .rythme-wrap{margin-top:0!important;display:flex;flex-direction:column}
.drv-rating-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding-bottom:14px;border-bottom:1px dashed #d8ccb4;margin-bottom:14px}
.drv-rating-head h2{margin:4px 0}
.drv-score-badge{background:var(--ink);color:#f8f2e4;border:2px solid #d7a347;padding:8px 14px;text-align:center;min-width:92px;flex-shrink:0}
.drv-score-badge strong{display:block;font-family:Impact,'Arial Narrow',sans-serif;font-size:28px;line-height:1;color:#d7a347;font-weight:400}
.drv-score-badge span{display:block;font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:#e7dec9;margin-top:3px;font-weight:700}
.drv-gauge{margin:13px 0}
.drv-gauge-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px}
.drv-gauge-val{font-family:Impact,'Arial Narrow',sans-serif;font-size:16px;letter-spacing:.5px;color:var(--ink)}
.drv-gauge-val small{font-family:Arial,sans-serif;font-size:11px;color:#6d726c;font-weight:400}
.drv-bar{height:11px;background:#dfd3bc;position:relative;border:1px solid #c9bba1}
.drv-bar i{display:block;height:100%;background:var(--red)}
.drv-bar i.g-hi{background:#3b6341}
.drv-bar i.g-mid{background:#d7a347}
.drv-bar i.g-lo{background:#9c3021}
.drv-bar-mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;border-left:1px dashed rgba(16,42,50,.55);z-index:2;pointer-events:none}
.drv-gauge-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;padding-top:10px;border-top:1px dashed #d8ccb4;font-size:11px;color:#6d726c}
.drv-gauge-legend .dot{display:inline-block;width:8px;height:8px;margin-right:4px;vertical-align:middle}
.drv-gauge-legend .dot-hi{background:#3b6341}
.drv-gauge-legend .dot-mid{background:#d7a347}
.drv-gauge-legend .dot-lo{background:#9c3021}
.drv-portrait-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.drv-portrait-card{border-left:5px solid var(--ink)}
.drv-portrait-card.drv-portrait-pos{border-left-color:#3b6341}
.drv-portrait-card.drv-portrait-axe{border-left-color:var(--red)}
.drv-portrait-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.drv-portrait-head h3{margin:2px 0 0;font-size:19px}
.drv-portrait-ico{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.drv-portrait-ico.pos{background:rgba(59,99,65,.14);color:#3b6341;border:1px solid #3b6341}
.drv-portrait-ico.axe{background:rgba(156,48,33,.12);color:var(--red);border:1px solid var(--red)}
.drv-portrait-list{margin:0;padding-left:18px;font-size:13px;line-height:1.65;color:#46504e}
.drv-portrait-list li{margin:5px 0}
.podium-pill{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:2px 8px;font-family:Impact,'Arial Narrow',sans-serif;font-size:15px;letter-spacing:.5px;border-radius:2px}
.podium-pill.p1{background:#d7a347;color:#2a1a0c;border:1px solid #b58228}
.podium-pill.p2{background:#d8d4ca;color:#102a32;border:1px solid #aba598}
.podium-pill.p3{background:#c58b59;color:#fff;border:1px solid #9f6a3c}
.delta-pill{display:inline-block;padding:2px 8px;font-size:11px;font-weight:700;border-radius:2px;font-variant-numeric:tabular-nums}
.delta-pill.up{background:rgba(59,99,65,.14);color:#2d5233;border:1px solid rgba(59,99,65,.35)}
.delta-pill.down{background:rgba(156,48,33,.12);color:#9c3021;border:1px solid rgba(156,48,33,.32)}
.delta-pill.eq{background:#ebe2cd;color:#6d726c;border:1px solid #d4c7ad}
.hist-mono{font-variant-numeric:tabular-nums;white-space:nowrap}
.coll-zero{color:#3b6341;font-weight:700}
@media(max-width:960px){
  .drv-hero,.drv-perf-grid,.drv-portrait-grid{grid-template-columns:1fr}
  .drv-hero-car{border-left:0;border-top:1px solid var(--line)}
  .drv-kpis{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:540px){
  .drv-kpis{grid-template-columns:1fr}
