[ABOUT]
NAME = GDSP Rolling Start
AUTHOR = GDSP
VERSION = 1.1.0
DESCRIPTION = Race Control hybride : Depart lance (1x1/2x2) ou arrete, depart anticipe, penalites de cut par virage (DT / Stop&Go / temps fin de course)
REQUIRED_VERSION = 2144
URL = https://github.com/pkp56/classement-ac

[CORE]
LAZY = NONE

[WINDOW_...]
ID = hud
NAME = Rolling Start HUD
ICON = icon.png
FUNCTION_MAIN = windowHud
FUNCTION_ON_SHOW = onHudShow
FUNCTION_ON_HIDE = onHudHide
FUNCTION_SETTINGS = windowSettings
SIZE = 460, 310
MIN_SIZE = 240, 155
MAX_SIZE = 1400, 960
FLAGS = MAIN, SETTINGS, NO_SCROLLBAR, FADING

[WINDOW_...]
ID = cuts_widget
NAME = GDSP Compteur Cuts
ICON = icon.png
FUNCTION_MAIN = windowCuts
SIZE = 240, 84
MIN_SIZE = 140, 56
MAX_SIZE = 720, 220
FLAGS = NO_SCROLLBAR, NO_COLLAPSE

[WINDOW_...]
ID = race_control
NAME = Rolling Start — Race Control
ICON = icon.png
FUNCTION_MAIN = windowAdmin
SIZE = 540, 620
MIN_SIZE = 420, 360
MAX_SIZE = 1400, 1100
FLAGS = NO_COLLAPSE

[RENDER_CALLBACKS]
TRANSPARENT = draw3D
