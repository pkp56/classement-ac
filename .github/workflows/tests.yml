name: Tests

# Vérifie les 590 tests (calcul des classements, live timing, télémétrie,
# scripts CSP, gestion des serveurs AC) sur chaque pull request et sur main.
# Aucun secret n'est nécessaire : les tests utilisent des fixtures locales.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Lancer la suite de tests
        run: npm test
